name: Publish Docker Image

on:
  push:
    branches: ['main']
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Follows whoever owns the repository; no hardcoded account needed.
  IMAGE_NAME: ${{ github.repository_owner }}/opencode-gateway

jobs:
  verify:
    name: Verify before publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CI: 'true'
      OPENCODE_PROXY_MANAGE_BACKEND: 'false'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (unit + contract + verification)
        run: npm run test:all

      - name: Build smoke-test image
        run: docker build --tag opencode-gateway:smoke .

      - name: Smoke-test container
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(
            docker run -d               -p 127.0.0.1:18080:10000               -e OPENCODE_PROXY_MANAGE_BACKEND=false               -e API_KEY=smoke-key               opencode-gateway:smoke
          )"
          trap 'docker logs "$container_id" || true; docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:18080/health | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 1
          done

          echo "Container did not become healthy" >&2
          exit 1

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=${{ github.run_number }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max