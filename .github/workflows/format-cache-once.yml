name: Format runtime usage once

on:
  push:
    branches:
      - fix/runtime-cache-usage-20261011

permissions:
  contents: write

jobs:
  format-once:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format three changed files and remove this temporary workflow
        run: |
          npx prettier --write src/routes/chat-handler.js src/upstreams/runtime-usage.js tests/unit/upstreams/runtime-usage.test.js
          rm .github/workflows/format-cache-once.yml
          git add src/routes/chat-handler.js src/upstreams/runtime-usage.js tests/unit/upstreams/runtime-usage.test.js .github/workflows/format-cache-once.yml
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "style: apply Prettier to runtime usage fix"
          git push origin "HEAD:${GITHUB_REF_NAME}"
