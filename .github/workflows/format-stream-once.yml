name: Format SSE usage fix once

on:
  push:
    branches:
      - fix/responses-sse-usage-20261011

permissions:
  contents: write

jobs:
  format-once:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format changed SSE file and remove temporary workflow
        run: |
          npx prettier --write src/protocol/stream.js
          rm .github/workflows/format-stream-once.yml
          git add src/protocol/stream.js .github/workflows/format-stream-once.yml
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "style: apply Prettier to SSE usage mapping"
          git push origin "HEAD:${GITHUB_REF_NAME}"
