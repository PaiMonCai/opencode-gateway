name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      # The suite must never need a real OpenCode runtime or network access.
      OPENCODE_PROXY_MANAGE_BACKEND: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (unit + contract + verification)
        run: npm run test:all
