name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      # The suite must never need a real OpenCode runtime or network access.
      OPENCODE_PROXY_MANAGE_BACKEND: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      # TEMPORARY: produce exact Prettier-formatted source for a one-time
      # branch sync. This step is removed before the PR can be merged.
      - name: Format preview
        run: |
          files=(
            src/protocol/bridge.js
            src/protocol/stream.js
            src/upstreams/direct-client.js
            src/routes/direct-turn.js
            src/routes/engine.js
            src/routes/index.js
            src/routes/streaming/sse.js
            tests/unit/protocol/bridge.test.js
            tests/unit/routes/direct-turn.test.js
            README.md
            docs/zh/api-reference.md
            docs/en/api-reference.md
          )
          npx prettier --write "${files[@]}"
          for path in "${files[@]}"; do
            echo "FMTSTART:$path"
            base64 -w0 "$path"
            printf '\n'
            echo "FMTEND:$path"
          done

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (unit + contract + verification)
        run: npm run test:all
