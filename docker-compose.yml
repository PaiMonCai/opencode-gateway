# docker-compose.yml — gateway container with its two OpenCode volumes.
#
#   cp .env.example .env      # API_KEY and OPENCODE_SERVER_PASSWORD are the two
#   docker compose up -d      # values you normally must set; the rest defaults
#
# `environment:` reads the host's `.env` (compose interpolation) and passes each
# value to the container; `docs/zh/configuration.md` documents every variable and
# its default. `build:` is only used when you ask for it — a plain
# `docker compose up -d` uses the published image.

services:
  opencode-gateway:
    image: ghcr.io/paimoncai/opencode-gateway:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opencode-gateway
    restart: unless-stopped

    ports:
      # Host and container keep the same port so `$OPENCODE_PROXY_PORT` in the
      # URLs below is always the one you reach from the outside.
      - '${OPENCODE_PROXY_PORT:-10000}:${OPENCODE_PROXY_PORT:-10000}'

    environment:
      # --- container only: user/group used for the OpenCode volumes ---------
      PUID: '${PUID:-1000}'
      PGID: '${PGID:-1000}'

      # --- listener and managed backend ------------------------------------
      OPENCODE_PROXY_PORT: '${OPENCODE_PROXY_PORT:-10000}'
      BIND_HOST: '${BIND_HOST:-0.0.0.0}'
      OPENCODE_SERVER_PORT: '${OPENCODE_SERVER_PORT:-10001}'
      OPENCODE_SERVER_URL: '${OPENCODE_SERVER_URL:-http://127.0.0.1:10001}'
      OPENCODE_PATH: '${OPENCODE_PATH:-opencode}'
      OPENCODE_PROXY_MANAGE_BACKEND: '${OPENCODE_PROXY_MANAGE_BACKEND:-true}'
      OPENCODE_USE_ISOLATED_HOME: '${OPENCODE_USE_ISOLATED_HOME:-false}'

      # --- credentials (empty means "not configured") ----------------------
      API_KEY: '${API_KEY:-}'
      OPENCODE_SERVER_PASSWORD: '${OPENCODE_SERVER_PASSWORD:-}'
      OPENCODE_ZEN_API_KEY: '${OPENCODE_ZEN_API_KEY:-}'

      # --- tool policy ------------------------------------------------------
      OPENCODE_DISABLE_TOOLS: '${OPENCODE_DISABLE_TOOLS:-true}'
      OPENCODE_EXTERNAL_TOOLS_MODE: '${OPENCODE_EXTERNAL_TOOLS_MODE:-proxy-bridge}'
      OPENCODE_INTERNAL_ALLOWED_TOOLS: '${OPENCODE_INTERNAL_ALLOWED_TOOLS:-}'
      OPENCODE_INTERNAL_WEB_FETCH_ENABLED: '${OPENCODE_INTERNAL_WEB_FETCH_ENABLED:-false}'

      # --- prompt handling --------------------------------------------------
      OPENCODE_PROXY_PROMPT_MODE: '${OPENCODE_PROXY_PROMPT_MODE:-standard}'
      OPENCODE_PROXY_OMIT_SYSTEM_PROMPT: '${OPENCODE_PROXY_OMIT_SYSTEM_PROMPT:-false}'

      # --- conversations ----------------------------------------------------
      OPENCODE_PROXY_SESSION_REUSE: '${OPENCODE_PROXY_SESSION_REUSE:-true}'
      OPENCODE_PROXY_SESSION_TTL_MS: '${OPENCODE_PROXY_SESSION_TTL_MS:-1800000}'
      OPENCODE_PROXY_SESSION_HEADERS: '${OPENCODE_PROXY_SESSION_HEADERS:-}'
      OPENCODE_PROXY_SESSION_DERIVE: '${OPENCODE_PROXY_SESSION_DERIVE:-false}'
      OPENCODE_PROXY_STORAGE_CLEANUP: '${OPENCODE_PROXY_STORAGE_CLEANUP:-off}'
      OPENCODE_PROXY_REQUEST_TIMEOUT_MS: '${OPENCODE_PROXY_REQUEST_TIMEOUT_MS:-180000}'

      # --- direct upstream --------------------------------------------------
      OPENCODE_PROXY_OPS: '${OPENCODE_PROXY_OPS:-health}'
      OPENCODE_PROXY_DIRECT: '${OPENCODE_PROXY_DIRECT:-true}'
      OPENCODE_PROXY_DIRECT_GO_URL: '${OPENCODE_PROXY_DIRECT_GO_URL:-https://opencode.ai/zen/go/v1}'
      OPENCODE_PROXY_DIRECT_ZEN_URL: '${OPENCODE_PROXY_DIRECT_ZEN_URL:-https://opencode.ai/zen/v1}'
      OPENCODE_PROXY_DIRECT_FALLBACK: '${OPENCODE_PROXY_DIRECT_FALLBACK:-true}'
      OPENCODE_PROXY_UPSTREAM_PROXY: '${OPENCODE_PROXY_UPSTREAM_PROXY:-}'
      OPENCODE_PROXY_UPSTREAM_PROXY_FOR_RUNTIME: '${OPENCODE_PROXY_UPSTREAM_PROXY_FOR_RUNTIME:-true}'
      # Standard proxy variables are lower-precedence fallbacks understood by
      # the gateway. Pass them through explicitly because Compose does not copy
      # arbitrary values from .env into the container.
      ALL_PROXY: '${ALL_PROXY:-}'
      HTTPS_PROXY: '${HTTPS_PROXY:-}'
      HTTP_PROXY: '${HTTP_PROXY:-}'
      NO_PROXY: '${NO_PROXY:-}'
      all_proxy: '${all_proxy:-}'
      https_proxy: '${https_proxy:-}'
      http_proxy: '${http_proxy:-}'
      no_proxy: '${no_proxy:-}'

      # --- operational endpoints and logs -----------------------------------
      OPENCODE_PROXY_DEBUG: '${OPENCODE_PROXY_DEBUG:-false}'
      OPENCODE_GATEWAY_EVENT_IDLE_TIMEOUT_MS: '${OPENCODE_GATEWAY_EVENT_IDLE_TIMEOUT_MS:-8000}'
      OPENCODE_GATEWAY_EVENT_FIRST_DELTA_TIMEOUT_MS: '${OPENCODE_GATEWAY_EVENT_FIRST_DELTA_TIMEOUT_MS:-30000}'

    volumes:
      - opencode-data:/home/node/.local/share/opencode
      - opencode-config:/home/node/.config/opencode

    healthcheck:
      # `$$` is a literal `$` for compose, so the port is resolved *inside* the
      # container and the check keeps working behind a different host port.
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:$${OPENCODE_PROXY_PORT:-10000}/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    # Unbounded json-file logs fill a NAS disk sooner or later; keep 3 x 10 MB.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  opencode-data:
  opencode-config:
